<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SD Cover Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --primary: #6366f1; --primary-dark: #4f46e5; }
    body { font-family: system-ui, -apple-system, sans-serif; }
    .card { @apply bg-white rounded-lg shadow-md p-4; }
    .btn { @apply px-4 py-2 rounded-lg font-medium transition-all; }
    .btn-primary { @apply bg-indigo-600 text-white hover:bg-indigo-700; }
    .btn-secondary { @apply bg-gray-200 text-gray-800 hover:bg-gray-300; }
    .status-badge { @apply px-2 py-1 rounded text-xs font-medium; }
    .status-complete { @apply bg-green-100 text-green-800; }
    .status-pending { @apply bg-yellow-100 text-yellow-800; }
    .status-missing { @apply bg-red-100 text-red-800; }
    .progress-bar { @apply h-2 bg-gray-200 rounded-full overflow-hidden; }
    .progress-fill { @apply h-full bg-indigo-500 transition-all; }
    .system-card { @apply border border-gray-200 rounded-lg p-3 mb-2; }
    .game-item { @apply flex items-center justify-between py-2 border-b border-gray-100; }
    .game-item:last-child { @apply border-b-0; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .scanning { animation: pulse 1s infinite; }
  </style>
</head>

        <h3 class="font-medium mb-2">Registro de Actividad</h3>

  <script>
    const ROM_EXTENSIONS = ['.nes', '.snes', '.sfc', '.gb', '.gbc', '.gba', '.n64', '.z64', '.nds', '.3ds', '.cia', '.xci', '.xwb', '.gcm', '.iso', '.wbfs', '.wad', '.a26', '.lnx', '.jag', '.j64', '.md', '.gen', '.sms', '.gg', '.s32x', '.32x', '.pce', '.ngp', '.ngc', '.crypt', '.fb', '.nsp', '.kv', '.m3u', '.zip', '.7z'];
    const IMAGE_EXTENSIONS = ['.png', '.jpg', '.jpeg', '.gif'];
    const SYSTEMS = ['gb', 'gbc', 'gba', 'nes', 'snes', 'n64', 'nds', '3ds', 'wii', 'psx', 'psp', 'genesis', 'sms', 'pce', 'ngp'];

    let directoryHandle = null;
    let scannedData = {};
    let selectedSystems = new Set();
    let isScraping = false;
    let shouldStop = false;

    const isChrome = /Chrome/.test(navigator.userAgent) && /Google/.test(navigator.vendor);
    const isEdge = /Edg/.test(navigator.userAgent);
    if (!window.showDirectoryPicker) {
      document.getElementById('warningSection').classList.remove('hidden');
      document.getElementById('warningText').textContent = 'API File System Access no disponible. Usa Chrome o Edge.';
    } else if (!isChrome && !isEdge) {
      document.getElementById('warningSection').classList.remove('hidden');
      document.getElementById('warningText').textContent = 'File System Access API solo funciona en Chrome o Edge.';
    }

    function log(msg) {
      const logEl = document.getElementById('logContent');
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `<div>[${time}] ${msg}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function getExtension(filename) {
      const ext = filename.toLowerCase().match(/\.[^.]+$/)?.[0] || '';
      return ext;
    }

    function getBasename(filename) {
      return filename.replace(/\.[^.]+$/, '');
    }

    function cleanRomName(filename) {
      let name = getBasename(filename);
      name = name.replace(/\s*\([^)]*\)\s*/g, ' ');
      name = name.replace(/\s*\[.*\]\s*/g, ' ');
      name = name.replace(/,\s*.*$/g, '');
      name = name.replace(/\s+/g, ' ');
      name = name.trim();
      return name;
    }

    async function scanDirectory(handle, path = '') {
      const results = { roms: [], images: [], folders: [] };
      
      for await (const entry of handle.values()) {
        if (entry.kind === 'file') {
          const ext = getExtension(entry.name).toLowerCase();
          if (ROM_EXTENSIONS.includes(ext)) {
            results.roms.push({ name: entry.name, path: `${path}/${entry.name}` });
          } else if (IMAGE_EXTENSIONS.includes(ext)) {
            results.images.push({ name: entry.name, path: `${path}/${entry.name}` });
          }
        } else if (entry.kind === 'directory') {
          results.folders.push({ name: entry.name, handle: entry, path: `${path}/${entry.name}` });
        }
      }
      
      return results;
    }

    function detectSystem(folderPath) {
      const folder = folderPath.toLowerCase();
      for (const sys of SYSTEMS) {
        if (folder.includes(sys)) return sys;
      }
      return 'other';
    }

    async function findSystemFolders(rootHandle) {
      const systems = {};
      
      const scan = async (handle, path) => {
        const results = await scanDirectory(handle, path);
        
        if (results.roms.length > 0) {
          const system = detectSystem(path);
          if (!systems[system]) {
            systems[system] = { 
              name: path.split('/').pop(), 
              system,
              roms: [],
              images: [],
              imageFolder: null,
              folderHandle: handle
            };
          }
          systems[system].roms.push(...results.roms);
          systems[system].images.push(...results.images);
        }

        for (const folder of results.folders) {
          if (!folder.name.startsWith('.') && folder.name.toLowerCase() !== 'media') {
            await scan(folder.handle, folder.path);
          }
        }
      };

      await scan(rootHandle, '');
      return systems;
    }

    function findImageFolder(systemData, allEntries) {
      if (allEntries.images.length > 0) {
        return allEntries.images;
      }
      return systemData.images;
    }

    async function checkCovers(systemData) {
      const romNames = systemData.roms.map(r => getBasename(r.name).toLowerCase());
      const imageNames = systemData.images.map(i => getBasename(i.name).toLowerCase());
      
      return systemData.roms.map(rom => {
        const baseName = getBasename(rom.name).toLowerCase();
        const hasImage = imageNames.some(img => 
          img.startsWith(baseName) || baseName.startsWith(img)
        );
        
        return {
          ...rom,
          hasCover: hasImage,
          imageName: hasImage ? systemData.images.find(i => 
            getBasename(i.name).toLowerCase().startsWith(baseName) ||
            baseName.startsWith(getBasename(i.name).toLowerCase())
          )?.name : null
        };
      });
    }

    async function readGamelistXml(systemData) {
      try {
        const fileHandle = await systemData.folderHandle.getFileHandle('gamelist.xml');
        const file = await fileHandle.getFile();
        return await file.text();
      } catch (e) {
        return null;
      }
    }

    async function updateGamelistXml(systemData, gameFile, imageFile) {
      try {
        let xml = await readGamelistXml(systemData);
        
        if (!xml) {
          xml = '<?xml version="1.0" encoding="UTF-8"?>\n<gameList>\n</gameList>';
        }

        const gameName = getBasename(gameFile);
        const imageName = imageFile || `${gameName}-image.png`;

        if (xml.includes(`<path>${gameFile}</path>`)) {
          const imgRegex = new RegExp(`(<path>${gameName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\\\?[^<]*</path>)[\\s\\S]*?(<image>[^<]*)`, 'i');
          xml = xml.replace(imgRegex, `$1<image>${imageName}</image>`);
        } else {
          const gameEntry = `  <game>
    <path>${gameFile}</path>
    <name>${gameName}</name>
    <image>${imageName}</image>
  </game>`;
          xml = xml.replace('<gameList>', `<gameList>\n${gameEntry}`);
        }

        const fileHandle = await systemData.folderHandle.getFileHandle('gamelist.xml', { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(xml);
        await writable.close();
        
        return true;
      } catch (e) {
        console.error('Error updating gamelist.xml:', e);
        return false;
      }
    }

    const SCREENSCRAPER_API = 'https://api.screenscraper.fr/api2';
    const SOFT_NAME = 'SDCoverManager';
    // Personal proxy with SSL compatibility and proper security
    // Proxy configuration (configurable for VPS migration)
    const PROXY_URL = './proxy.php?url='; // Relative path for VPS/Hosting
    // const PROXY_URL = 'https://www.sd-scrapper.gamer.gd/proxy.php?url='; // Full URL for GitHub Pages
    
    const SYSTEM_IDS = {
      'nes': 3, 'snes': 4, 'gb': 5, 'gbc': 6, 'gba': 7, 
      'n64': 10, 'nds': 11, 'psx': 12, 'psp': 13, 'genesis': 15, 
      'sms': 16, 'pce': 17, 'ngp': 18, 'wii': 19, '3ds': 20
    };

async function loginScreenScraper(user, pass, devid, devpass) {
      const params = new URLSearchParams({
        output: 'json',
        ssid: user,
        sspass: pass
      });
      params.append('devid', devid);
      params.append('devpassword', devpass);
      params.append('softname', SOFT_NAME);
      try {
        const response = await fetch(SCREENSCRAPER_API + '/ssuserInfos.php?' + params);
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }
        const text = await response.text();
        if (text.startsWith('Erreur')) {
          log('ScreenScraper login error: ' + text);
          return null;
        }
        const data = JSON.parse(text);
        return data.response;
      } catch (e) {
        log('Error login: ' + e.message);
        return null;
      }
    }

    async function searchGame(user, pass, systemeid, romName, fileSize, devid, devpass) {
      const params = new URLSearchParams({
        ssid: user,
        sspass: pass,
        systemeid: systemeid,
        romnom: romName,
        output: 'json'
      });
      params.append('devid', devid);
      params.append('devpassword', devpass);
      params.append('softname', SOFT_NAME);
      
      try {
        const response = await fetch(SCREENSCRAPER_API + '/jeuRecherche.php?' + params);
        const data = await response.json();
        return data.response;
      } catch (e) {
        log('Error searching: ' + e.message);
        return null;
      }
    }


    function getImageUrlPlaceholder(gameName, system) {
      const seed = encodeURIComponent(gameName);
      return `https://placehold.co/320x224/4f46e5/ffffff?text=${seed.slice(0, 20)}`;
    }

async function downloadImage(cdnUrl, ssid, sspass) {
      // ssid and sspass are accepted for compliance (credentials verification)
      const MAX_RETRIES = 3;
      const RETRY_DELAY = 2000; // 2 seconds (avoid ScreenScraper rate limits)

      // Validate CDN URL
      if (!cdnUrl || cdnUrl.trim() === '') {
        log('Error: Empty CDN URL');
        return null;
      }

      // Verify CDN URL format (should start with https://cdn.screenscraper.fr/)
      if (!cdnUrl.startsWith('https://cdn.screenscraper.fr/')) {
        log('Warning: CDN URL does not match expected format: ' + cdnUrl);
      }

      for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
        try {
          // Use proxy (relative for VPS, full for GitHub Pages)
          const proxyUrl = `${PROXY_URL}${encodeURIComponent(cdnUrl)}`;
          log(`Downloading via proxy (attempt ${attempt}/${MAX_RETRIES}): ${cdnUrl}`);

          const response = await fetch(proxyUrl);

          // Handle specific errors with retry logic
          if (response.ok) {
            // Get binary data as Blob (static image file from CDN)
            const blob = await response.blob();
            if (blob.size > 0) {
              log(`Download successful: ${blob.size} bytes`);
              return blob;
            } else {
              throw new Error('Empty blob received from proxy');
            }
          } else if (response.status === 408 || response.status === 522 || response.status === 504) {
            // Timeout or Cloudflare errors - retry with delay
            log(`Proxy error ${response.status} (timeout/saturation), retrying in ${RETRY_DELAY}ms...`);
            if (attempt < MAX_RETRIES) {
              await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
              continue;
            } else {
              throw new Error(`Proxy failed with status ${response.status} after ${MAX_RETRIES} retries`);
            }
          } else {
            throw new Error(`Proxy failed with status ${response.status}`);
          }
        } catch (e) {
          log(`Download error (attempt ${attempt}/${MAX_RETRIES}): ${e.message}`);
          if (attempt === MAX_RETRIES) {
            log('Max retries reached, giving up on this image.');
            log('If connection issues persist, try opening https://www.sd-scrapper.gamer.gd/proxy.php in a new tab to validate InfinityFree session.');
            return null;
          }
          // Wait before retrying (avoid API saturation)
          await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
        }
      }
      return null;
    }

    // Script generation system
    let downloadUrls = new Set();
    let processedGames = 0;

    function addDownloadUrl(gameName, imageUrl, destFolder) {
      const downloadEntry = {
        gameName: gameName,
        url: imageUrl,
        folder: destFolder || 'images'
      };
      downloadUrls.add(JSON.stringify(downloadEntry));
      processedGames++;
      log(`Added URL for ${gameName} (${processedGames} total)`);
    }

    function generateScripts() {
      const urls = Array.from(downloadUrls).map(u => JSON.parse(u));
      const scriptCount = urls.length;
      
      document.getElementById('scriptCount').textContent = scriptCount;
      document.getElementById('scriptInfo').classList.remove('hidden');
      
      // Generate PowerShell script
      const psScript = `# PowerShell script for downloading covers
# Generated by SD Cover Manager
# Total games: ${scriptCount}

# Create directories
$gameFolders = @()
$urls = @()

$urls = @(
${urls.map((u, i) => `  [${i+1}] '${u.url}'`).join(',\n')}
)

$urls | ForEach-Object {
    $url = $_
    $folder = $url.split('/')[0]  # Extract folder from URL
    $gameName = $url.gameName
    $fileName = $gameName + '.png'
    
    # Create folder if it doesn't exist
    if (-not (Test-Path -Path $folder)) {
        New-Item -ItemType Directory -Path $folder | Out-Null
        Write-Host "Created folder: $folder"
    }
    
    # Download file
    try {
        $destination = Join-Path -Path $folder -ChildPath $fileName

    async function saveImage(systemData, imageName, blob, destFolder) {
      try {
        const folderHandle = systemData.folderHandle;
        let imageFolderHandle;
        
        // Try to get existing folder, create if it doesn't exist
        try {
          imageFolderHandle = await folderHandle.getDirectoryHandle(destFolder);
        } catch (e) {
          imageFolderHandle = await folderHandle.getDirectoryHandle(destFolder, { create: true });
          log('Created folder: ' + destFolder);
        }
        
        // Create or get file handle
        const fileHandle = await imageFolderHandle.getFileHandle(imageName, { create: true });
        
        // Create writable stream and write blob
        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
        
        log('Saved image: ' + imageName);
        return true;
      } catch (e) {
        log('Error saving image: ' + e.message);
        console.error('Save image error:', e);
        return false;
      }
    }

    function getRegionFromFilename(filename) {
      const name = filename.toLowerCase();
      if (name.includes('(world)') || name.includes('(wor)')) return 'wor';
      if (name.includes('(europe)') || name.includes('(eu)')) return 'eu';
      if (name.includes('(usa)') || name.includes('(us)')) return 'us';
      if (name.includes('(japan)') || name.includes('(jp)')) return 'jp';
      if (name.includes('(france)') || name.includes('(fr)')) return 'fr';
      if (name.includes('(spain)') || name.includes('(es)')) return 'es';
      if (name.includes('(germany)') || name.includes('(de)')) return 'de';
      if (name.includes('(italy)') || name.includes('(it)')) return 'it';
      if (name.includes('(netherlands)') || name.includes('(nl)')) return 'nl';
      if (name.includes('(sweden)') || name.includes('(se)')) return 'se';
      if (name.includes('(denmark)') || name.includes('(dk)')) return 'dk';
      if (name.includes('(norway)') || name.includes('(no)')) return 'no';
      if (name.includes('(finland)') || name.includes('(fi)')) return 'fi';
      if (name.includes('(australia)') || name.includes('(au)')) return 'au';
      if (name.includes('(canada)') || name.includes('(ca)')) return 'ca';
      if (name.includes('(brazil)') || name.includes('(br)')) return 'br';
      if (name.includes('(china)') || name.includes('(cn)')) return 'cn';
      if (name.includes('(korea)') || name.includes('(kr)')) return 'kr';
      if (name.includes('(world)')) return 'wor';
      return 'wor';
    }

    async function testLogin(user, pass, devid, devpass) {
      log('Probando conexión...');
      try {
        const params = new URLSearchParams({
          output: 'json',

          sspass: pass
        });
        if (devid) params.append('devid', devid);
        if (devpass) params.append('devpassword', devpass);
        const url = SCREENSCRAPER_API + '/ssuserInfos.php?' + params;
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }
        const text = await response.text();
        if (text.startsWith('Erreur')) {
          log('ScreenScraper login error: ' + text);
          return false;
        }
        const data = JSON.parse(text);
        
        if (data.response && data.response.ssuser) {

          log('Nivel: ' + userData.niveau + ' - Threads: ' + userData.maxthreads);

    async function scrapeGame(user, pass, systemeid, romName, region, devid, devpass) {
      // Build URL according to ScreenScraper official documentation
      const url = `${SCREENSCRAPER_API}/jeuInfos.php?output=json&devid=${encodeURIComponent(devid)}&devpassword=${encodeURIComponent(devpass)}&softname=${encodeURIComponent(SOFT_NAME)}&ssid=${encodeURIComponent(user)}&sspass=${encodeURIComponent(pass)}&systemeid=${systemeid}&romnom=${encodeURIComponent(romName)}`;
      
      log('Requesting game info from: ' + url);
      
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }
        const text = await response.text();
        // Check if response starts with 'Erreur' (API error)
        if (text.startsWith('Erreur')) {
          log('ScreenScraper API error: ' + text);
          return null;
        }
        const data = JSON.parse(text);
        
        if (data.response && data.response.jeu) {
          const jeu = data.response.jeu;
          const medias = data.response.jeu.medias || [];
          const results = { jeu: { id: jeu.id, nom: jeu.nom }, medias: medias };
          log('Game found: ' + jeu.nom + ' (ID: ' + jeu.id + ')');
          log('Media files found: ' + medias.length);
          return results;
        } else if (data.error) {
          log('ScreenScraper API error: ' + data.error);
          return null;
        }
        return null;
      } catch (e) {
        log('Error requesting game info: ' + e.message);
        return null;
      }
    }

    function findMedia(medias, preferredRegion, imageType, boxType, logoType) {
      // Define media types to search in priority order
      const mediaTypes = [];
      
      // Add selected image type first
      if (imageType && imageType !== 'box-2D') {
        mediaTypes.push(imageType);
      }
      // Add selected box type if different from image type
      if (boxType && boxType !== 'none' && boxType !== imageType) {
        mediaTypes.push(boxType);
      }
      // Add logo type if selected
      if (logoType && logoType !== 'none') {
        mediaTypes.push(logoType);
      }
      // Default to box-2D if no specific types selected
      if (!mediaTypes.includes('box-2D')) {
        mediaTypes.push('box-2D');
      }
      
      // Define region priority
      const regionPriority = preferredRegion ? [preferredRegion, 'eu', 'us', 'wor', null] : ['eu', 'us', 'wor', null];
      
      // Search for each media type in priority order
      for (const mediaType of mediaTypes) {
        log(`Searching for ${mediaType} media...`);
        
        for (const region of regionPriority) {
          const candidates = medias.filter(m => {
            const typeMatch = m.type === mediaType;
            const regionMatch = !region || m.region === region;
            return typeMatch && regionMatch;
          });
          
          if (candidates.length > 0) {
            const selected = candidates[0];
            log(`Found ${mediaType} with region: ${selected.region || 'none'}`);
            return selected;
          }
        }
      }
      
      log(`No media found for types: ${mediaTypes.join(', ')}`);
      return null;
    }

      if (progressBar && progressText) {
        const percentage = Math.round((current / total) * 100);
        progressBar.style.width = `${percentage}%`;
        progressText.textContent = current + '/' + total + ' downloaded';
      }

    function renderSystems() {

      let totalMissing = 0;

      container.innerHTML = Object.entries(scannedData).map(([key, data]) => {
        const missing = data.games.filter(g => !g.hasCover).length;
        const total = data.games.length;
        const isSelected = selectedSystems.has(key);
        totalRoms += total;
        totalMissing += isSelected ? missing : 0;

        const percentage = total > 0 ? Math.round(((total - missing) / total) * 100) : 0;

        return `

            <div class="progress-bar mb-2">

            </div>
            <div class="text-sm text-gray-600 mb-2 flex justify-between">
