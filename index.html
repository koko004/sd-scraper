  <script>
    const ROM_EXTENSIONS = ['.nes', '.snes', '.sfc', '.gb', '.gbc', '.gba', '.n64', '.z64', '.nds', '.3ds', '.cia', '.xci', '.xwb', '.gcm', '.iso', '.wbfs', '.wad', '.a26', '.lnx', '.jag', '.j64', '.md', '.gen', '.sms', '.gg', '.s32x', '.32x', '.pce', '.ngp', '.ngc', '.crypt', '.fb', '.nsp', '.kv', '.m3u', '.zip', '.7z'];
    const IMAGE_EXTENSIONS = ['.png', '.jpg', '.jpeg', '.gif'];
    const VIDEO_EXTENSIONS = ['.mp4', '.webm', '.mkv', '.avi'];
    const SYSTEMS = ['gb', 'gbc', 'gba', 'nes', 'snes', 'n64', 'nds', '3ds', 'wii', 'psx', 'psp', 'genesis', 'sms', 'pce', 'ngp'];

    let directoryHandle = null;
    let scannedData = {};
    let selectedSystems = new Set();
    let isScraping = false;
    let shouldStop = false;
    let failedDownloads = [];

    const isChrome = /Chrome/.test(navigator.userAgent) && /Google/.test(navigator.vendor);
    const isEdge = /Edg/.test(navigator.userAgent);
    if (!window.showDirectoryPicker) {
      document.getElementById('warningSection').classList.remove('hidden');
      document.getElementById('warningText').textContent = 'API File System Access no disponible. Usa Chrome o Edge.';
    } else if (!isChrome && !isEdge) {
      document.getElementById('warningSection').classList.remove('hidden');
      document.getElementById('warningText').textContent = 'File System Access API solo funciona en Chrome o Edge.';
    }

    function log(msg) {
      // Obfuscate developer credentials in logs
      let safeMsg = msg.replace(DEV_PASSWORD, '***');
      safeMsg = safeMsg.replace(DEV_ID, '***');
      
      const logEl = document.getElementById('logContent');
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += '<div>[' + time + '] ' + safeMsg + '</div>';
      logEl.scrollTop = logEl.scrollHeight;
    }

    function getExtension(filename) {
      const ext = filename.toLowerCase().match(/\.[^.]+$/)?.[0] || '';
      return ext;
    }

    function getBasename(filename) {
      return filename.replace(/\.[^.]+$/, '');
    }

    function cleanRomName(filename) {
      let name = getBasename(filename);
      name = name.replace(/\s*\([^)]*\)\s*/g, ' ');
      name = name.replace(/\s*\[.*\]\s*/g, ' ');
      name = name.replace(/,\s*.*$/g, '');
      name = name.replace(/\s+/g, ' ');
      name = name.trim();
      return name;
    }

    function cleanRomNameForSearch(filename) {
      let name = getBasename(filename);
      // Remove parentheses and brackets
      name = name.replace(/\s*\([^)]*\)\s*/g, ' ');
      name = name.replace(/\s*\[.*\]\s*/g, ' ');
      // Remove trailing comments after comma
      name = name.replace(/,\s*.*$/g, '');
      // Remove accents and special characters
      name = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      // Remove extra spaces
      name = name.replace(/\s+/g, ' ');
      name = name.trim();
      return name;
    }

    // CRC32 implementation for ROM hash
    function crc32(data) {
      let crc = 0xFFFFFFFF;
      const table = [];
      
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) {
          c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }
        table[i] = c;
      }
      
      for (let i = 0; i < data.length; i++) {
        crc = table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
      }
      
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    async function calculateRomHash(romHandle, fileSize) {
      const MAX_SIZE = 50 * 1024 * 1024; // 50MB limit
      
      if (fileSize > MAX_SIZE) {
        log('Archivo muy grande para hash (' + (fileSize / 1024 / 1024).toFixed(1) + 'MB), usando nombre');
        return null;
      }
      
      try {
        log('Calculando huella digital...');
        const file = await romHandle.getFile();
        const buffer = await file.slice(0, Math.min(fileSize, MAX_SIZE)).arrayBuffer();
        const uint8 = new Uint8Array(buffer);
        const hash = crc32(uint8);
        return hash.toString(16).toUpperCase();
      } catch (e) {
        log('Error calculando hash: ' + e.message);
        return null;
      }
    }

    async function scanDirectory(handle, path = '') {
      const results = { roms: [], images: [], videos: [], folders: [], gamelist: null };
      const MEDIA_FOLDERS = ['media', 'image', 'images', 'imagen', 'imagenes', 'video', 'videos', 'box', 'covers', 'snap'];
      
      for await (const entry of handle.values()) {
        if (entry.kind === 'file') {
          const ext = getExtension(entry.name).toLowerCase();
          const nameLower = entry.name.toLowerCase();
          
          if (ROM_EXTENSIONS.includes(ext)) {
            // Get file size for hash calculation
            let fileSize = 0;
            try {
              const file = await entry.getFile();
              fileSize = file.size;
            } catch (e) {}
            results.roms.push({ name: entry.name, path: path + '/' + entry.name, size: fileSize, handle: entry });
          } else if (IMAGE_EXTENSIONS.includes(ext)) {
            results.images.push({ name: entry.name, path: path + '/' + entry.name });
          } else if (VIDEO_EXTENSIONS.includes(ext)) {
            results.videos.push({ name: entry.name, path: path + '/' + entry.name });
          } else if (nameLower === 'gamelist.xml') {
            // Store gamelist.xml content
            try {
              const file = await entry.getFile();
              results.gamelist = await file.text();
              log('Encontrado gamelist.xml en: ' + path);
            } catch (e) {
              // Ignore
            }
          }
        } else if (entry.kind === 'directory') {
          const folderName = entry.name.toLowerCase();
          if (folderName.startsWith('.') || folderName === 'tmp' || folderName === 'temp') {
            continue;
          }
          
          // Scan subfolders - prioritize media folders, but scan all
          try {
            const subResults = await scanDirectory(entry.handle, path + '/' + entry.name);
            
            // Add media from subfolders
            if (subResults.images.length > 0 || subResults.videos.length > 0) {
              results.images.push(...subResults.images);
              results.videos.push(...subResults.videos);
              // Only log media folders
              if (MEDIA_FOLDERS.includes(folderName)) {
                log('Carpeta ' + entry.name + ': ' + subResults.images.length + ' img, ' + subResults.videos.length + ' vid');
              }
            }
            
            // Merge gamelist if found
            if (subResults.gamelist && !results.gamelist) {
              results.gamelist = subResults.gamelist;
            }
          } catch (e) {
            // Skip inaccessible
          }
          
          results.folders.push({ name: entry.name, handle: entry, path: path + '/' + entry.name });
        }
      }
      
      return results;
    }

    function detectSystem(folderPath) {
      const folder = folderPath.toLowerCase();
      for (const sys of SYSTEMS) {
        if (folder.includes(sys)) return sys;
      }
      return 'other';
    }

    async function findSystemFolders(rootHandle) {
      const systems = {};
      
      const scan = async (handle, path) => {
        const results = await scanDirectory(handle, path);
        
        if (results.roms.length > 0) {
          const system = detectSystem(path);
          if (!systems[system]) {
            systems[system] = { 
              name: path.split('/').pop(), 
              system,
              roms: [],
              images: [],
              videos: [],
              gamelist: results.gamelist,
              folderHandle: handle
            };
          }
          systems[system].roms.push(...results.roms);
          systems[system].images.push(...results.images);
          systems[system].videos.push(...results.videos);
          if (results.gamelist && !systems[system].gamelist) {
            systems[system].gamelist = results.gamelist;
          }
        }

        for (const folder of results.folders) {
          if (!folder.name.startsWith('.') && folder.name.toLowerCase() !== 'media') {
            await scan(folder.handle, folder.path);
          }
        }
      };

      await scan(rootHandle, '');
      return systems;
    }

    async function checkCovers(systemData) {
      // Get image names from direct file scan
      const imageNames = systemData.images.map(i => getBasename(i.name).toLowerCase());
      
      // Check gamelist.xml that was scanned along with the system
      let gamelistImages = [];
      if (systemData.gamelist) {
        try {
          const imgMatches = systemData.gamelist.match(/<image>([^<]+)<\/image>/g) || [];
          gamelistImages = imgMatches.map(m => {
            const imgPath = m.replace(/<[^>]+>/g, '');
            return getBasename(imgPath).toLowerCase();
          });
          log('gamelist.xml encontrado con ' + gamelistImages.length + ' imagenes');
        } catch (e) {
          // Ignore
        }
      }
      
      // Combine all known image names
      const allImageNames = [...new Set([...imageNames, ...gamelistImages])];
      log('Total imagenes conocidas para ' + (systemData.name || 'sistema') + ': ' + allImageNames.length);
      
      return systemData.roms.map(rom => {
        const baseName = getBasename(rom.name).toLowerCase();
        const hasImage = allImageNames.some(img => 
          img.startsWith(baseName) || baseName.startsWith(img) || img.includes(baseName)
        );
        
        // Find matching image
        let matchedImage = null;
        if (hasImage) {
          matchedImage = systemData.images.find(i => {
            const imgBase = getBasename(i.name).toLowerCase();
            return imgBase.startsWith(baseName) || baseName.startsWith(imgBase) || imgBase.includes(baseName);
          });
          
          if (!matchedImage) {
            const gamelistMatch = gamelistImages.find(img => 
              img.startsWith(baseName) || baseName.startsWith(img) || img.includes(baseName)
            );
            if (gamelistMatch) {
              matchedImage = { name: gamelistMatch + '.png' };
            }
          }
        }
        
        return {
          ...rom,
          hasCover: hasImage,
          imageName: matchedImage ? matchedImage.name : null
        };
      });
    }

    async function readGamelistXml(systemData) {
      try {
        const fileHandle = await systemData.folderHandle.getFileHandle('gamelist.xml');
        const file = await fileHandle.getFile();
        return await file.text();
      } catch (e) {
        return null;
      }
    }

    async function updateGamelistXml(systemData, gameFile, imageFile) {
      try {
        let xml = await readGamelistXml(systemData);
        
        if (!xml) {
          xml = '<?xml version="1.0" encoding="UTF-8"?>\n<gameList>\n</gameList>';
        }

        const gameName = getBasename(gameFile);
        const imageName = imageFile || gameName + '-image.png';

        if (xml.includes('<path>' + gameFile + '</path>')) {
          const imgRegex = new RegExp('(<path>' + gameName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\\\?[^<]*</path>)[\\s\\S]*?(<image>[^<]*)', 'i');
          xml = xml.replace(imgRegex, '$1<image>' + imageName + '</image>');
        } else {
          const gameEntry = '  <game>\n    <path>' + gameFile + '</path>\n    <name>' + gameName + '</name>\n    <image>' + imageName + '</image>\n  </game>';
          xml = xml.replace('<gameList>', '<gameList>\n' + gameEntry);
        }

        const fileHandle = await systemData.folderHandle.getFileHandle('gamelist.xml', { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(xml);
        await writable.close();
        
        return true;
      } catch (e) {
        console.error('Error updating gamelist.xml:', e);
        return false;
      }
    }

    const SCREENSCRAPER_API = 'https://api.screenscraper.fr/api2';
    const SOFT_NAME = 'SDCoverManager';
    const MY_PROXY = './proxy.php?url=';
    
    // Hardcoded developer credentials
    const DEV_ID = 'koko004';
    const DEV_PASSWORD = 'EhkHQozlUSq';
    
    const SYSTEM_MAP = {
      'gb': 9, 'gbc': 10, 'gba': 25, 'nes': 3, 'snes': 4, 'sfc': 4,
      'n64': 14, 'nds': 28, '3ds': 43, 'wii': 17, 'wiiu': 41,
      'mastersystem': 2, 'sms': 2, 'genesis': 1, 'megadrive': 1,

    async function scrapeGame(user, pass, systemeid, romData, region) {
      const romName = romData.name;
      const romHandle = romData.handle;
      const fileSize = romData.size || 0;
      const devid = DEV_ID;
      const devpass = DEV_PASSWORD;
      
      // Calculate hash if possible
      let hash = null;
      if (romHandle && fileSize > 0) {
        hash = await calculateRomHash(romHandle, fileSize);
      }
      
      // === ATTEMPT 1: CRC32 Hash ===
      if (hash) {
        const hashUrl = SCREENSCRAPER_API + '/jeuInfos.php?output=json&devid=' + encodeURIComponent(devid) + '&devpassword=' + encodeURIComponent(devpass) + '&softname=' + encodeURIComponent(SOFT_NAME) + '&ssid=' + encodeURIComponent(user) + '&sspassword=' + encodeURIComponent(pass) + '&systemeid=' + systemeid + '&crc=' + hash;
        
        log('Buscando por CRC: ' + romName + ' [' + hash + ']');
        
        try {
          const response = await fetch(hashUrl);
          if (response.status === 404) {
            // Hash found nothing, try fallback with cleaned name
            log('CRC no encontrado, intentando nombre limpio...');
          } else if (response.ok) {
            const text = await response.text();
            if (!text.startsWith('Erreur') && text.includes('"jeu"')) {
              const data = JSON.parse(text);
              if (data.response && data.response.jeu) {
                const jeu = data.response.jeu;
                const medias = data.response.jeu.medias || [];
                log('Encontrado por CRC: ' + jeu.nom);
                return { jeu: { id: jeu.id, nom: jeu.nom }, medias: medias };
              }
            }
          }
        } catch (e) {
          log('Error CRC: ' + e.message);
        }
      }
      
      // === ATTEMPT 2: Fallback with cleaned name (only if hash failed or returned 404) ===
      const cleanName = cleanRomNameForSearch(romName);
      const cleanUrl = SCREENSCRAPER_API + '/jeuInfos.php?output=json&devid=' + encodeURIComponent(devid) + '&devpassword=' + encodeURIComponent(devpass) + '&softname=' + encodeURIComponent(SOFT_NAME) + '&ssid=' + encodeURIComponent(user) + '&sspassword=' + encodeURIComponent(pass) + '&systemeid=' + systemeid + '&romnom=' + encodeURIComponent(cleanName);
      
      log('Buscando: ' + cleanName);
      
      try {
        const response = await fetch(cleanUrl);
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }
        const text = await response.text();
        if (text.startsWith('Erreur')) {
          log('API error: ' + text);
          return null;
        }
        const data = JSON.parse(text);
        
        if (data.response && data.response.jeu) {
          const jeu = data.response.jeu;
          const medias = data.response.jeu.medias || [];
          log('Encontrado: ' + jeu.nom);
          return { jeu: { id: jeu.id, nom: jeu.nom }, medias: medias };
        }
        
        // Try original name as last resort
        if (cleanName !== romName) {
          const origUrl = SCREENSCRAPER_API + '/jeuInfos.php?output=json&devid=' + encodeURIComponent(devid) + '&devpassword=' + encodeURIComponent(devpass) + '&softname=' + encodeURIComponent(SOFT_NAME) + '&ssid=' + encodeURIComponent(user) + '&sspassword=' + encodeURIComponent(pass) + '&systemeid=' + systemeid + '&romnom=' + encodeURIComponent(romName);
          
          const origResponse = await fetch(origUrl);
          if (origResponse.ok) {
            const origText = await origResponse.text();
            if (!origText.startsWith('Erreur') && origText.includes('"jeu"')) {
              const origData = JSON.parse(origText);
              if (origData.response && origData.response.jeu) {
                const jeu = origData.response.jeu;
                log('Encontrado (original): ' + jeu.nom);
                return { jeu: { id: jeu.id, nom: jeu.nom }, medias: origData.response.jeu.medias || [] };
              }
            }
          }
        }
        
        return null;
      } catch (e) {
        log('Error busqueda: ' + e.message);
        return null;
      }
    }

    async function downloadImage(cdnUrl) {
      const MAX_RETRIES = 3;
      const RETRY_DELAY = 2000;

      if (!cdnUrl || cdnUrl.trim() === '') {
        log('Error: URL CDN vacia');
        return null;
      }

      for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
        try {
          const proxyUrl = MY_PROXY + encodeURIComponent(cdnUrl);
          log('Descargando (intento ' + attempt + '/' + MAX_RETRIES + '): ' + cdnUrl.substring(0, 50) + '...');

          const response = await fetch(proxyUrl);

          if (response.ok) {
            const blob = await response.blob();
            if (blob.size > 0) {
              log('Descarga exitosa: ' + blob.size + ' bytes');
              return blob;
            } else {
              throw new Error('Blob vacio recibido del proxy');
            }
          } else if (response.status === 408 || response.status === 522 || response.status === 504) {
            log('Error proxy ' + response.status + ', reintentando en ' + RETRY_DELAY + 'ms...');
            if (attempt < MAX_RETRIES) {
              await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
              continue;
            } else {
              throw new Error('Proxy falló con estado ' + response.status + ' despues de ' + MAX_RETRIES + ' intentos');
            }
          } else {
            throw new Error('Proxy falló con estado ' + response.status);
          }
        } catch (e) {
          log('Error descarga (intento ' + attempt + '/' + MAX_RETRIES + '): ' + e.message);
          if (attempt === MAX_RETRIES) {
            log('Maximo de intentos alcanzado, saltando esta imagen.');
            return null;
          }
          await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
        }
      }
      return null;
    }

    async function ensureFolderExists(systemHandle, folderName) {
      try {
        return await systemHandle.getDirectoryHandle(folderName);
      } catch (e) {
        return await systemHandle.getDirectoryHandle(folderName, { create: true });
      }
    }

    async function saveImage(systemData, imageName, blob, destFolder) {
      try {
        const folderHandle = systemData.folderHandle;
        
        // Ensure destination folder exists
        const imageFolderHandle = await ensureFolderExists(folderHandle, destFolder);
        
        // Create or get file handle
        const fileHandle = await imageFolderHandle.getFileHandle(imageName, { create: true });
        
        // Create writable stream and write blob
        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
        
        log('Imagen guardada: ' + imageName + ' en ' + destFolder);
        return true;
      } catch (e) {
        log('Error guardando imagen: ' + e.message);
        console.error('Save image error:', e);
        return false;
      }
    }

    function getRegionFromFilename(filename) {
      const name = filename.toLowerCase();
      if (name.includes('(world)') || name.includes('(wor)')) return 'wor';
      if (name.includes('(europe)') || name.includes('(eu)')) return 'eu';
      if (name.includes('(usa)') || name.includes('(us)')) return 'us';
      if (name.includes('(japan)') || name.includes('(jp)')) return 'jp';
      if (name.includes('(france)') || name.includes('(fr)')) return 'fr';
      return 'wor';
    }

    function findMedia(medias, preferredRegion, imageType, boxType, logoType) {
      const mediaTypes = [];
      
      // Add selected image type first
      if (imageType && imageType !== 'none') {
        mediaTypes.push(imageType);
      }
      
      // Add box type if different from image
      if (boxType && boxType !== 'none' && boxType !== imageType) {
        mediaTypes.push(boxType);
      }
      
      // Add logo type if selected
      if (logoType && logoType !== 'none') {
        mediaTypes.push(logoType);
      }
      
      // Default fallback
      if (mediaTypes.length === 0) {
        mediaTypes.push('screenshot', 'box-2D');
      }
      
      // Define region priority
      const regionPriority = preferredRegion ? [preferredRegion, 'eu', 'us', 'jp', 'fr', 'wor', null] : ['eu', 'us', 'jp', 'fr', 'wor', null];
      
      // Search for each media type in priority order
      for (var i = 0; i < mediaTypes.length; i++) {
        var mediaType = mediaTypes[i];
        
        for (var j = 0; j < regionPriority.length; j++) {
          var region = regionPriority[j];
          var candidates = medias.filter(function(m) {
            var typeMatch = m.type === mediaType;
            var regionMatch = !region || m.region === region;
            return typeMatch && regionMatch;
          });
          
          if (candidates.length > 0) {
            var selected = candidates[0];
            log('Encontrado ' + mediaType + ' region: ' + (selected.region || 'ninguna'));
            return selected;
          }
        }
      }
      
      log('No se encontró media para tipos: ' + mediaTypes.join(', '));
      return null;
    }

    function findSpecificMedia(medias, preferredRegion, mediaType) {
      var regionPriority = preferredRegion ? [preferredRegion, 'eu', 'us', 'jp', 'fr', 'wor', null] : ['eu', 'us', 'jp', 'fr', 'wor', null];
      
      for (var i = 0; i < regionPriority.length; i++) {
        var region = regionPriority[i];
        var candidates = medias.filter(function(m) {
          var typeMatch = m.type === mediaType;
          var regionMatch = !region || m.region === region;
          return typeMatch && regionMatch;
        });
        
        if (candidates.length > 0) {
          return candidates[0];
        }
      }
      
      return null;
    }

    function findVideo(medias, preferredRegion) {
      var regionPriority = preferredRegion ? [preferredRegion, 'eu', 'us', 'wor', null] : ['eu', 'us', 'wor', null];
      
      for (var i = 0; i < regionPriority.length; i++) {
        var region = regionPriority[i];
        var candidates = medias.filter(function(m) {
          var typeMatch = m.type === 'video';
          var regionMatch = !region || m.region === region;
          return typeMatch && regionMatch;
        });
        
        if (candidates.length > 0) {
          return candidates[0];
        }
      }
      
      return null;
    }

    async function simulateScraping() {

      var logoType = document.getElementById('logoType').value;
      var preferredRegion = document.getElementById('preferredRegion').value;
      var scanRatings = document.getElementById('scanRatings').checked;
      var downloadVideos = document.getElementById('downloadVideos').checked;
      
      // Get credentials
      var ssUser = document.getElementById('ssUser').value.trim();
      var ssPass = document.getElementById('ssPass').value;
      var devid = document.getElementById('devId').value.trim();
      var devpass = document.getElementById('devPass').value;
      var destFolder = destFolderSelect.value;
      if (destFolder === 'custom') {
        destFolder = customFolderInput.value.trim() || 'images';
      }
      var videoFolder = videoFolderSelect.value;
      if (videoFolder === 'custom') {
        videoFolder = videoCustomFolderInput.value.trim() || 'videos';
      }
      
      // Validate credentials
      if (!ssUser || !ssPass) {
        log('ERROR: Ingresa usuario y password de ScreenScraper');
        isScraping = false;
        scrapingBtn.disabled = false;
        stopBtn.classList.add('hidden');
        document.getElementById('progressGlobal').classList.add('hidden');
        scrapingBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg> Iniciar Scraping';
        return;
      }

      log('Usuario: ' + ssUser);
      log('Carpeta imagenes: /' + destFolder);
      log('Carpeta videos: /' + videoFolder);
      log('Media: img=' + imageType + ' box=' + boxType + ' logo=' + logoType + ' region=' + preferredRegion);

      var processed = 0;
      var updated = 0;
      var totalToProcess = 0;
      var selectedSystemsArray = Array.from(selectedSystems);
      for (var j = 0; j < selectedSystemsArray.length; j++) {
        var key = selectedSystemsArray[j];
        var data = scannedData[key];
        if (data) {
          totalToProcess += data.games.filter(function(g) { return !g.hasCover; }).length;
        }
      }

      for (var i = 0; i < selectedSystemsArray.length; i++) {
        var systemKey = selectedSystemsArray[i];
        if (shouldStop) {
          log('Proceso detenido por el usuario');
          break;
        }
        
        var systemData = scannedData[systemKey];
        if (!systemData) continue;

        var systemeid = SYSTEM_MAP[systemKey.toLowerCase()] || 0;
        if (!systemeid) {
          log('Sistema no reconocido: ' + systemKey + ', usando busqueda global');
        } else {
          log('Sistema: ' + systemKey + ' (ID: ' + systemeid + ')');
        }

        var gamesWithoutCover = systemData.games.filter(function(g) { return !g.hasCover; });
        var systemProcessed = 0;
        
        for (var i = 0; i < gamesWithoutCover.length; i++) {
          if (shouldStop) {
            log('Proceso detenido por el usuario');
            break;
          }
          
          var game = gamesWithoutCover[i];
          var searchName = cleanRomName(game.name);
          var region = getRegionFromFilename(game.name);
          progressText.textContent = (processed + 1) + '/' + totalToProcess;

          try {
            var jeuData = await scrapeGame(ssUser, ssPass, systemeid, game, region);

            if (jeuData && jeuData.jeu && jeuData.jeu.id) {
              var medias = jeuData.medias || [];
              var downloaded = false;
              var mediaTypes = [];
              
              // Add all selected media types
              if (imageType && imageType !== 'none') mediaTypes.push(imageType);
              if (boxType && boxType !== 'none') mediaTypes.push(boxType);
              if (logoType && logoType !== 'none') mediaTypes.push(logoType);
              
              // Download each media type
              for (var m = 0; m < mediaTypes.length; m++) {
                var mediaType = mediaTypes[m];
                var selectedMedia = findSpecificMedia(medias, preferredRegion, mediaType);
                
                if (selectedMedia && selectedMedia.url) {
                  var cdnUrl = selectedMedia.url;
                  var blob = await downloadImage(cdnUrl);
                  if (blob && blob.size > 0) {
                    var ext = (mediaType === 'video') ? '.mp4' : '.png';
                    var mediaName = getBasename(game.name) + '_' + mediaType + ext;
                    var folder = (mediaType === 'video') ? videoFolder : destFolder;
                    if (mediaType === 'video') {
                      await saveVideo(systemData, mediaName, blob, folder);
                      log('VIDEO ' + mediaType + ': ' + mediaName);
                    } else {
                      var saved = await saveImage(systemData, mediaName, blob, folder);
                      if (saved) {
                        if (!game.hasCover) {
                          var imagePath = '/' + folder + '/' + mediaName;
                          await updateGamelistXml(systemData, game.path, imagePath);
                          game.hasCover = true;
                          game.imageName = imagePath;
                        }
                        downloaded = true;
                        log('COVER ' + mediaType + ': ' + mediaName);
                      }
                    }
                  } else {
                    log('FALLO ' + mediaType + ': ' + searchName);
                  }
                }
              }

              // Handle video download
              if (downloadVideos && !shouldStop) {
                var videoMedia = findVideo(medias, preferredRegion);
                if (videoMedia && videoMedia.url) {
                  var videoBlob = await downloadImage(videoMedia.url);
                  if (videoBlob && videoBlob.size > 0) {
                    var videoName = getBasename(game.name) + '.mp4';
                    await saveVideo(systemData, videoName, videoBlob, videoFolder);
                    log('VIDEO: ' + videoName);
                  }
                }
              }

              if (downloaded) {
                updated++;
              }
            } else {
              log('No encontrado: ' + searchName);
              failedDownloads.push(searchName);
            }
          } catch (e) {
            log('Error: ' + e.message);
            failedDownloads.push(searchName);
          }

          systemProcessed++;
          processed++;
          renderSystemsProgress(systemKey, systemProcessed, gamesWithoutCover.length);
          await new Promise(function(r) { setTimeout(r, 1000); });
        }
      }

      log('=== SCRAPING COMPLETADO ===');
      log('Covers actualizados: ' + updated);
      
      if (failedDownloads.length > 0) {
        log('FALLOS (' + failedDownloads.length + '): ' + failedDownloads.slice(0, 5).join(', ') + (failedDownloads.length > 5 ? '...' : ''));
      }
      
      // Re-scan to detect newly downloaded files
      log('Re-escaneando archivos...');
      for (var systemKey in scannedData) {
        var systemData = scannedData[systemKey];
        if (systemData && systemData.folderHandle) {
          // Re-check covers
          var allImages = [];
          try {
            var results = await scanDirectory(systemData.folderHandle, '');
            allImages = results.images;
          } catch (e) {
            console.log('Error re-scanning:', e);
          }
          
          var imageNames = allImages.map(function(i) { return getBasename(i.name).toLowerCase(); });
          
          // Update each game's cover status
          for (var g = 0; g < systemData.games.length; g++) {
            var game = systemData.games[g];
            var baseName = getBasename(game.name).toLowerCase();
            var hasImage = imageNames.some(function(img) {
              return img.startsWith(baseName) || baseName.startsWith(img);
            });
            
            if (hasImage && !game.hasCover) {
              var matchingImage = allImages.find(function(i) {
                var imgBase = getBasename(i.name).toLowerCase();
                return imgBase.startsWith(baseName) || baseName.startsWith(imgBase);
              });
              if (matchingImage) {
                game.hasCover = true;
                game.imageName = matchingImage.name;
              }
            }
          }
          
          systemData.images = allImages;
          log('Re-escaneado ' + systemKey + ': ' + allImages.length + ' imagenes');
        }
      }
      
      isScraping = false;
      scrapingBtn.disabled = false;
      stopBtn.classList.add('hidden');
      scrapingBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg> Iniciar Scraping';

      renderSystems();
    }

      shouldStop = true;
      log('Deteniendo proceso...');
    }

        progressBar.style.width = percentage + '%';
        progressTextEl.textContent = current + '/' + total + ' descargados';

          '<span>' + total + ' ROMs - ' + missing + ' sin cover - ' + percentage + '%</span>' +
          '<span class="system-progress-text text-indigo-600 font-medium">0/' + missing + ' descargados</span></div>' +
          '<div class="max-h-48 overflow-y-auto border-t border-gray-200 pt-2">' + gamesHtml + '</div></div>';
      }
      container.innerHTML = html;

      document.getElementById('totalSystems').textContent = Object.keys(scannedData).length;
      document.getElementById('totalRoms').textContent = totalRoms;
      document.getElementById('totalMissing').textContent = totalMissing;
    }

    async function handleSelectFolder() {
      try {
        directoryHandle = await window.showDirectoryPicker({
          mode: 'readwrite',
          suggestedName: 'ArkOS SD'
        });

        document.getElementById('folderPath').textContent = directoryHandle.name;
        document.getElementById('folderPath').classList.remove('hidden');

        log('Carpeta seleccionada: ' + directoryHandle.name);
        log('Escaneando estructura...');

        var systems = await findSystemFolders(directoryHandle);

        log('Encontrados ' + Object.keys(systems).length + ' sistemas');
        
        // Log detailed scan results
        for (var key in systems) {
          var data = systems[key];
          log('Sistema ' + key + ' - ROMs: ' + data.roms.length + ', Imagenes encontradas: ' + data.images.length + ', Videos: ' + data.videos.length);
          if (data.images.length > 0) {
            log('  Primeras imagenes: ' + data.images.slice(0, 3).map(i => i.name).join(', '));
          }
        }

        for (var key in systems) {
          var data = systems[key];
          data.games = await checkCovers(data);
        }

        scannedData = systems;
        selectedSystems = new Set(Object.keys(systems));
        document.getElementById('statsSection').classList.remove('hidden');
        document.getElementById('scrapingBtn').disabled = false;

        renderSystems();
        log('Escaneo completado!');

      } catch (e) {
        if (e.name !== 'AbortError') {
          log('Error: ' + e.message);
          console.error(e);
        }
      }
    }
    
    var selectFolderBtn = document.getElementById('selectFolderBtn');
    var scrapingBtn = document.getElementById('scrapingBtn');
    var stopBtn = document.getElementById('stopBtn');
    var testLoginBtn = document.getElementById('testLoginBtn');
    var destFolderSelect = document.getElementById('destFolderSelect');
    
    
    if (selectFolderBtn) selectFolderBtn.addEventListener('click', handleSelectFolder);
    if (scrapingBtn) scrapingBtn.addEventListener('click', simulateScraping);
    if (stopBtn) stopBtn.addEventListener('click', stopScraping);
    if (testLoginBtn) testLoginBtn.addEventListener('click', function() {
      var user = document.getElementById('ssUser').value.trim() || '';
      var pass = document.getElementById('ssPass').value || '';
      if (user && pass) {
        testLogin(user, pass);
      } else {
        log('Ingresa usuario y password');
      }
    });
    
    document.addEventListener('change', function(e) {
      if (e.target.classList.contains('system-checkbox')) {
        var key = e.target.dataset.system;
        if (e.target.checked) {
          selectedSystems.add(key);
        } else {
          selectedSystems.delete(key);
        }
        renderSystems();
      }
    });
    
    if (destFolderSelect) destFolderSelect.addEventListener('change', function() {
      var customInput = document.getElementById('customFolderInput');
      if (this.value === 'custom') {
        customInput.classList.remove('hidden');
      } else {
        customInput.classList.add('hidden');
      }
    });
    
    var videoFolderSelect = document.getElementById('videoFolderSelect');
    if (videoFolderSelect) videoFolderSelect.addEventListener('change', function() {
      var customInput = document.getElementById('videoCustomFolderInput');
      if (this.value === 'custom') {
        customInput.classList.remove('hidden');
      } else {
        customInput.classList.add('hidden');
      }
    });
    
    // Clear log button
    var clearLogBtn = document.getElementById('clearLogBtn');
    if (clearLogBtn) clearLogBtn.addEventListener('click', function() {
      document.getElementById('logContent').innerHTML = '';
      log('Log limpiado');
    });

    // Load saved credentials and show welcome
    window.addEventListener('load', function() {
      var savedUser = localStorage.getItem('ssUser');
      var savedPass = localStorage.getItem('ssPass');
      if (savedUser) document.getElementById('ssUser').value = savedUser;
      if (savedPass) document.getElementById('ssPass').value = savedPass;
      log('=== SD Cover Manager listo ===');
      log('Selecciona una carpeta para comenzar');
    });
  </script>
</body>
</html>
