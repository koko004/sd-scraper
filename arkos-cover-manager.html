<!DOCTYPE html>
<html lang="es">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArkOS Cover Manager - R36S</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --primary: #6366f1; --primary-dark: #4f46e5; }
    body { font-family: system-ui, -apple-system, sans-serif; }
    .card { @apply bg-white rounded-lg shadow-md p-4; }
    .btn { @apply px-4 py-2 rounded-lg font-medium transition-all; }
    .btn-primary { @apply bg-indigo-600 text-white hover:bg-indigo-700; }
    .btn-secondary { @apply bg-gray-200 text-gray-800 hover:bg-gray-300; }
    .status-badge { @apply px-2 py-1 rounded text-xs font-medium; }
    .status-complete { @apply bg-green-100 text-green-800; }
    .status-pending { @apply bg-yellow-100 text-yellow-800; }
    .status-missing { @apply bg-red-100 text-red-800; }
    .progress-bar { @apply h-2 bg-gray-200 rounded-full overflow-hidden; }
    .progress-fill { @apply h-full bg-indigo-500 transition-all; }
    .system-card { @apply border border-gray-200 rounded-lg p-3 mb-2; }
    .game-item { @apply flex items-center justify-between py-2 border-b border-gray-100; }
    .game-item:last-child { @apply border-b-0; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .scanning { animation: pulse 1s infinite; }
  </style>
</head>

  <script>
    const ROM_EXTENSIONS = ['.nes', '.snes', '.sfc', '.gb', '.gbc', '.gba', '.n64', '.z64', '.nds', '.3ds', '.cia', '.xci', '.xwb', '.gcm', '.iso', '.wbfs', '.wad', '.a26', '.lnx', '.jag', '.j64', '.md', '.gen', '.sms', '.gg', '.s32x', '.32x', '.pce', '.ngp', '.ngc', '.crypt', '.fb', '.nsp', '.kv', '.m3u', '.zip', '.7z'];
    const IMAGE_EXTENSIONS = ['.png', '.jpg', '.jpeg', '.gif'];
    const SYSTEMS = ['gb', 'gbc', 'gba', 'nes', 'snes', 'n64', 'nds', '3ds', 'wii', 'psx', 'psp', 'genesis', 'sms', 'pce', 'ngp'];

    let directoryHandle = null;
    let scannedData = {};
    let selectedSystems = new Set();
    let isScraping = false;
    let shouldStop = false;

    const isChrome = /Chrome/.test(navigator.userAgent) && /Google/.test(navigator.vendor);
    const isEdge = /Edg/.test(navigator.userAgent);
    if (!window.showDirectoryPicker) {
      document.getElementById('warningSection').classList.remove('hidden');
      document.getElementById('warningText').textContent = 'API File System Access no disponible. Usa Chrome o Edge.';
    } else if (!isChrome && !isEdge) {
      document.getElementById('warningSection').classList.remove('hidden');
      document.getElementById('warningText').textContent = 'File System Access API solo funciona en Chrome o Edge.';
    }

    function log(msg) {
      const logEl = document.getElementById('logContent');
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `<div>[${time}] ${msg}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function getExtension(filename) {
      const ext = filename.toLowerCase().match(/\.[^.]+$/)?.[0] || '';
      return ext;
    }

    function getBasename(filename) {
      return filename.replace(/\.[^.]+$/, '');
    }

    function cleanRomName(filename) {
      let name = getBasename(filename);
      name = name.replace(/\s*\([^)]*\)\s*/g, ' ');
      name = name.replace(/\s*\[.*\]\s*/g, ' ');
      name = name.replace(/,\s*.*$/g, '');
      name = name.replace(/\s+/g, ' ');
      name = name.trim();
      return name;
    }

    async function scanDirectory(handle, path = '') {
      const results = { roms: [], images: [], folders: [] };
      
      for await (const entry of handle.values()) {
        if (entry.kind === 'file') {
          const ext = getExtension(entry.name).toLowerCase();
          if (ROM_EXTENSIONS.includes(ext)) {
            results.roms.push({ name: entry.name, path: `${path}/${entry.name}` });
          } else if (IMAGE_EXTENSIONS.includes(ext)) {
            results.images.push({ name: entry.name, path: `${path}/${entry.name}` });
          }
        } else if (entry.kind === 'directory') {
          results.folders.push({ name: entry.name, handle: entry, path: `${path}/${entry.name}` });
        }
      }
      
      return results;
    }

    function detectSystem(folderPath) {
      const folder = folderPath.toLowerCase();
      for (const sys of SYSTEMS) {
        if (folder.includes(sys)) return sys;
      }
      return 'other';
    }

    async function findSystemFolders(rootHandle) {
      const systems = {};
      
      const scan = async (handle, path) => {
        const results = await scanDirectory(handle, path);
        
        if (results.roms.length > 0) {
          const system = detectSystem(path);
          if (!systems[system]) {
            systems[system] = { 
              name: path.split('/').pop(), 
              system,
              roms: [],
              images: [],
              imageFolder: null,
              folderHandle: handle
            };
          }
          systems[system].roms.push(...results.roms);
          systems[system].images.push(...results.images);
        }

        for (const folder of results.folders) {
          if (!folder.name.startsWith('.') && folder.name.toLowerCase() !== 'media') {
            await scan(folder.handle, folder.path);
          }
        }
      };

      await scan(rootHandle, '');
      return systems;
    }

    function findImageFolder(systemData, allEntries) {
      if (allEntries.images.length > 0) {
        return allEntries.images;
      }
      return systemData.images;
    }

    async function checkCovers(systemData) {
      const romNames = systemData.roms.map(r => getBasename(r.name).toLowerCase());
      const imageNames = systemData.images.map(i => getBasename(i.name).toLowerCase());
      
      return systemData.roms.map(rom => {
        const baseName = getBasename(rom.name).toLowerCase();
        const hasImage = imageNames.some(img => 
          img.startsWith(baseName) || baseName.startsWith(img)
        );
        
        return {
          ...rom,
          hasCover: hasImage,
          imageName: hasImage ? systemData.images.find(i => 
            getBasename(i.name).toLowerCase().startsWith(baseName) ||
            baseName.startsWith(getBasename(i.name).toLowerCase())
          )?.name : null
        };
      });
    }

    async function readGamelistXml(systemData) {
      try {
        const fileHandle = await systemData.folderHandle.getFileHandle('gamelist.xml');
        const file = await fileHandle.getFile();
        return await file.text();
      } catch (e) {
        return null;
      }
    }

    async function updateGamelistXml(systemData, gameFile, imageFile) {
      try {
        let xml = await readGamelistXml(systemData);
        
        if (!xml) {
          xml = '<?xml version="1.0" encoding="UTF-8"?>\n<gameList>\n</gameList>';
        }

        const gameName = getBasename(gameFile);
        const imageName = imageFile || `${gameName}-image.png`;

        if (xml.includes(`<path>${gameFile}</path>`)) {
          const imgRegex = new RegExp(`(<path>${gameName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\\\?[^<]*</path>)[\\s\\S]*?(<image>[^<]*)`, 'i');
          xml = xml.replace(imgRegex, `$1<image>${imageName}</image>`);
        } else {
          const gameEntry = `  <game>
    <path>${gameFile}</path>
    <name>${gameName}</name>
    <image>${imageName}</image>
  </game>`;
          xml = xml.replace('<gameList>', `<gameList>\n${gameEntry}`);
        }

        const fileHandle = await systemData.folderHandle.getFileHandle('gamelist.xml', { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(xml);
        await writable.close();
        
        return true;
      } catch (e) {
        console.error('Error updating gamelist.xml:', e);
        return false;
      }
    }

    const SCREENSCRAPER_API = 'https://api.screenscraper.fr/api2';
    const SOFT_NAME = 'ArkOSCover';
    
    const SYSTEM_IDS = {
      'gb': 4, 'gbc': 5, 'gba': 6, 'nes': 7, 'snes': 8, 'n64': 9,
      'nds': 10, 'psx': 12, 'psp': 13, 'genesis': 15, 'sms': 16,
      'pce': 17, 'ngp': 18, 'wii': 20, '3ds': 21
    };

async function loginScreenScraper(user, pass, devid, devpass) {
      const params = new URLSearchParams({
        output: 'json',
        ssid: user,
        sspass: pass
      });
      params.append('devid', devid);
      params.append('devpassword', devpass);
      params.append('softname', SOFT_NAME);
      try {
        const response = await fetch(SCREENSCRAPER_API + '/ssuserInfos.php?' + params);
        const data = await response.json();
        return data.response;
      } catch (e) {
        log('Error login: ' + e.message);
        return null;
      }
    }

    async function searchGame(user, pass, systemeid, romName, fileSize, devid, devpass) {
      const params = new URLSearchParams({
        ssid: user,
        sspass: pass,
        systemeid: systemeid,

        output: 'json'
      });
      params.append('devid', devid);
      params.append('devpassword', devpass);
      params.append('softname', SOFT_NAME);
      
      try {

    async function getMediaUrl(user, pass, systemeid, jeuid, mediaType, region, devid, devpass) {
      const mediaRegion = region || 'wor';
      const params = new URLSearchParams({
        ssid: user,
        sspass: pass,

        jeuid: jeuid,
        media: mediaType + '(' + mediaRegion + ')'
      });
      params.append('devid', devid);
      params.append('devpassword', devpass);
      params.append('softname', SOFT_NAME);
      return SCREENSCRAPER_API + '/mediaJeu.php?' + params;
    }

    async function searchGame(user, pass, systemeid, romName, fileSize, devid, devpass) {
      const params = new URLSearchParams({
        ssid: user,
        sspass: pass,
        systemeid: systemeid,
        romnom: romName,
        output: 'json'
      });
      params.append('devid', devid);
      params.append('devpassword', devpass);
      params.append('softname', SOFT_NAME);
      
      try {
        const response = await fetch(SCREENSCRAPER_API + '/jeuRecherche.php?' + params);
        const data = await response.json();
        return data.response;
      } catch (e) {
        log('Error searching: ' + e.message);
        return null;
      }
    }

    async function getMediaUrl(user, pass, systemeid, jeuid, mediaType, region, devid, devpass) {
      const params = new URLSearchParams({
        action: 'mediaJeu',
        ssid: user,
        sspass: pass,
        media: mediaType,
        id: gameId,
        devid: '',
        devpassword: '',
        softname: SOFT_NAME
      });
      return SCREENSCRAPER_API + '/mediaJeu.php?' + params;
    }

    function getImageUrlPlaceholder(gameName, system) {
      const seed = encodeURIComponent(gameName);
      return `https://placehold.co/320x224/4f46e5/ffffff?text=${seed.slice(0, 20)}`;
    }

    async function downloadImage(url) {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Download failed');
        return await response.blob();
      } catch (e) {
        log(`Error descargando: ${e.message}`);
        return null;
      }
    }

    async function saveImage(systemData, imageName, blob, destFolder) {
      try {
        const folderHandle = systemData.folderHandle;
        let imageFolderHandle;
        
        try {
          imageFolderHandle = await folderHandle.getDirectoryHandle(destFolder);
        } catch (e) {
          imageFolderHandle = await folderHandle.getDirectoryHandle(destFolder, { create: true });
        }
        
        const fileHandle = await imageFolderHandle.getFileHandle(imageName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
        return true;
      } catch (e) {
        log('Error guardando imagen: ' + e.message);
        return false;
      }
    }

    function getRegionFromFilename(filename) {
      const name = filename.toLowerCase();
      if (name.includes('(world)') || name.includes('(wor)')) return 'wor';
      if (name.includes('(europe)') || name.includes('(eu)')) return 'eu';
      if (name.includes('(usa)') || name.includes('(us)')) return 'us';
      if (name.includes('(japan)') || name.includes('(jp)')) return 'jp';
      if (name.includes('(france)') || name.includes('(fr)')) return 'fr';
      if (name.includes('(spain)') || name.includes('(es)')) return 'es';
      if (name.includes('(germany)') || name.includes('(de)')) return 'de';
      if (name.includes('(italy)') || name.includes('(it)')) return 'it';
      if (name.includes('(netherlands)') || name.includes('(nl)')) return 'nl';
      if (name.includes('(sweden)') || name.includes('(se)')) return 'se';
      if (name.includes('(denmark)') || name.includes('(dk)')) return 'dk';
      if (name.includes('(norway)') || name.includes('(no)')) return 'no';
      if (name.includes('(finland)') || name.includes('(fi)')) return 'fi';
      if (name.includes('(australia)') || name.includes('(au)')) return 'au';
      if (name.includes('(canada)') || name.includes('(ca)')) return 'ca';
      if (name.includes('(brazil)') || name.includes('(br)')) return 'br';
      if (name.includes('(china)') || name.includes('(cn)')) return 'cn';
      if (name.includes('(korea)') || name.includes('(kr)')) return 'kr';
      if (name.includes('(world)')) return 'wor';
      return 'wor';
    }

    async function testLogin(user, pass, devid, devpass) {
      log('Probando conexión...');
      try {
        const params = new URLSearchParams({
          output: 'json',
          ssid: user,
          sspass: pass
        });
        params.append('devid', devid);
        params.append('devpassword', devpass);
        const url = SCREENSCRAPER_API + '/ssuserInfos.php?' + params;
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.response && data.response.ssuser) {
          const userData = data.response.ssuser;
          log('Login OK! Usuario: ' + userData.id);
          log('Nivel: ' + userData.niveau + ' - Threads: ' + userData.maxthreads);
          
          if (document.getElementById('saveCredentials').checked) {
            localStorage.setItem('ssUser', user);
            localStorage.setItem('ssPass', pass);
          }
          return true;
        } else if (data.error) {
          log('Error: ' + data.error);
          return false;
        }
        return false;
      } catch (e) {
        log('Error: ' + e.message);
        return false;
      }
    }

    async function scrapeGame(user, pass, systemeid, romName, region, devid, devpass) {
      const params = new URLSearchParams({
        output: 'json',
        ssid: user,
        sspass: pass,
        systemeid: systemeid,
        romnom: romName,
        romtype: 'rom'
      });
      params.append('devid', devid);
      params.append('devpassword', devpass);
      params.append('softname', SOFT_NAME);
      
      try {
        const url = SCREENSCRAPER_API + '/jeuInfos.php?' + params;
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.response && data.response.jeu) {
          const jeu = data.response.jeu;
          const results = { jeu: jeu };
          return results;
        }
        return null;
      } catch (e) {
        return null;
      }
    }

      params.append('devpassword', devpass);

      return SCREENSCRAPER_API + '/mediaJeu.php?' + params;

async function simulateScraping() {
      const scrapingBtn = document.getElementById('scrapingBtn');
      const stopBtn = document.getElementById('stopBtn');
      const progressText = document.getElementById('progressText');
      
      isScraping = true;
      shouldStop = false;
      scrapingBtn.disabled = true;
      stopBtn.classList.remove('hidden');
      scrapingBtn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Procesando...';
      document.getElementById('progressGlobal').classList.remove('hidden');
      document.getElementById('progressGlobal').classList.add('flex');

      document.getElementById('logSection').classList.remove('hidden');
      log('Iniciando scraping desde ScreenScraper...');

      const destFolderSelect = document.getElementById('destFolderSelect');
      const videoFolderSelect = document.getElementById('videoFolderSelect');
      const customFolderInput = document.getElementById('customFolderInput');
      const ssUser = document.getElementById('ssUser').value.trim();
      const ssPass = document.getElementById('ssPass').value;
      const downloadImages = document.getElementById('downloadImages').checked;
      const downloadVideos = document.getElementById('downloadVideos').checked;
      let destFolder = destFolderSelect.value;
      let videoFolder = videoFolderSelect.value;
      if (destFolder === 'custom') {
        destFolder = customFolderInput.value.trim() || 'images';
      }

      if (!ssUser || !ssPass) {
        log('ERROR: Ingresa usuario y password de ScreenScraper');
        isScraping = false;
        scrapingBtn.disabled = false;
        stopBtn.classList.add('hidden');
        document.getElementById('progressGlobal').classList.add('hidden');
        scrapingBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg> Descargar Covers';
        return;
      }

      log('Usuario: ' + ssUser);
      log('Imagenes: /' + destFolder + ' - Videos: /' + videoFolder);

      let processed = 0;
      let updated = 0;
      let totalToProcess = 0;
      for (const key of selectedSystems) {
        const data = scannedData[key];
        if (data) {
          totalToProcess += data.games.filter(g => !g.hasCover).length;
        }
      }

      for (const systemKey of selectedSystems) {
        if (shouldStop) {
          log('Proceso detenido por el usuario');
          break;
        }
        
        const systemData = scannedData[systemKey];
        if (!systemData) continue;

        const systemeid = SYSTEM_IDS[systemKey] || 0;
        if (!systemeid) {
          log('Sistema no soportado: ' + systemKey);
          continue;
        }

        const gamesWithoutCover = systemData.games.filter(g => !g.hasCover);
        let systemProcessed = 0;
        
        for (const game of gamesWithoutCover) {
          if (shouldStop) {
            log('Proceso detenido por el usuario');
            break;
          }
          
          const searchName = cleanRomName(game.name);
          const region = getRegionFromFilename(game.name);
          log('Buscando: ' + searchName + ' (' + systemKey + ') region:' + region);
          progressText.textContent = (processed + 1) + '/' + totalToProcess;

          try {
            const jeuData = await scrapeGame(ssUser, ssPass, systemeid, game.name, region);
            
            if (jeuData && jeuData.jeu && jeuData.jeu.id) {
              const jeuid = jeuData.jeu.id;
              let downloaded = false;
              
              if (downloadImages) {
                const imageUrl = await downloadMedia(ssUser, ssPass, systemeid, jeuid, 'box-2D', region);
                const blob = await downloadImage(imageUrl);
                if (blob && blob.size > 0) {
                  const imageName = searchName.replace(/[^a-zA-Z0-9]/g, '') + '-image.png';
                  const saved = await saveImage(systemData, imageName, blob, destFolder);
                  if (saved) {
                    const imagePath = '/' + destFolder + '/' + imageName;
                    await updateGamelistXml(systemData, game.name, imagePath);
                    game.hasCover = true;
                    game.imageName = imagePath;
                    downloaded = true;
                    log('Imagen: ' + imageName);
                  }
                }
              }
              
              if (downloadVideos && !shouldStop) {
                const videoUrl = await downloadMedia(ssUser, ssPass, systemeid, jeuid, 'video', region);
                const blob = await downloadImage(videoUrl);
                if (blob && blob.size > 0) {
                  const videoName = searchName.replace(/[^a-zA-Z0-9]/g, '') + '.mp4';
                  await saveImage(systemData, videoName, blob, videoFolder);
                  log('Video: ' + videoName);
                }
              }
              
              if (downloaded) {
                updated++;
              }
            } else {
              log('Juego no encontrado');
            }
          } catch (e) {
            log('Error: ' + e.message);
          }

          systemProcessed++;
          processed++;
          renderSystemsProgress(systemKey, systemProcessed, gamesWithoutCover.length);
          await new Promise(r => setTimeout(r, 1000));
        }
      }

      log('Scraping completado! Covers: ' + updated);
      
      isScraping = false;
      scrapingBtn.disabled = false;
      stopBtn.classList.add('hidden');
      scrapingBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg> Descargar Covers';

      renderSystems();
    }

    function stopScraping() {
      shouldStop = true;
      log('Deteniendo proceso...');
    }

    function renderSystemsProgress(systemKey, current, total) {
      const systemCard = document.getElementById(`system-${systemKey}`);
      if (!systemCard) return;
      
      const progressBar = systemCard.querySelector('.progress-fill');
      const progressText = systemCard.querySelector('.system-progress-text');
      if (progressBar && progressText) {
        const percentage = Math.round((current / total) * 100);
        progressBar.style.width = `${percentage}%`;
        progressText.textContent = `${current}/${total} descargado`;
      }
    }

    function toggleSystem(key) {
      if (selectedSystems.has(key)) {
        selectedSystems.delete(key);
      } else {
        selectedSystems.add(key);
      }
      renderSystems();
    }

    function selectAllSystems() {
      selectedSystems = new Set(Object.keys(scannedData));
      renderSystems();
    }

    function deselectAllSystems() {
      selectedSystems.clear();
      renderSystems();
    }

    function renderSystems() {
      const container = document.getElementById('systemsList');
      
      if (Object.keys(scannedData).length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500">No se encontraron juegos</p>';
        return;
      }

      let totalRoms = 0;
      let totalMissing = 0;

      container.innerHTML = Object.entries(scannedData).map(([key, data]) => {
        const missing = data.games.filter(g => !g.hasCover).length;
        const total = data.games.length;
        const isSelected = selectedSystems.has(key);
        totalRoms += total;
        totalMissing += isSelected ? missing : 0;

        const percentage = total > 0 ? Math.round(((total - missing) / total) * 100) : 0;

        return `
          <div class="system-card ${isSelected ? 'border-indigo-500' : 'border-gray-200'}" id="system-${key}">
            <div class="flex items-center gap-3 mb-2">
              <input type="checkbox" class="system-checkbox w-5 h-5 text-indigo-600" data-system="${key}" ${isSelected ? 'checked' : ''}>
              <h3 class="font-semibold text-lg uppercase">${data.name || key}</h3>
              <span class="status-badge ${missing === 0 ? 'status-complete' : 'status-pending'}">
                ${missing === 0 ? '✓ Completo' : `${missing} sin cover`}
              </span>
            </div>
            <div class="progress-bar mb-2">
              <div class="progress-fill" style="width: ${percentage}%"></div>
            </div>
            <div class="text-sm text-gray-600 mb-2 flex justify-between">
              <span>${total} ROMs · ${missing} faltantes · ${percentage}% cobertura</span>
              <span class="system-progress-text text-indigo-600 font-medium">0/${missing} descargado</span>
            </div>
            <div class="max-h-48 overflow-y-auto border-t border-gray-200 pt-2">
              ${data.games.map(g => `
                <div class="game-item">
                  <span class="text-sm truncate flex-1 mr-2">${g.name}</span>
                  <span class="status-badge ${g.hasCover ? 'status-complete' : 'status-missing'}">
                    ${g.hasCover ? '✓' : 'Pendiente'}
                  </span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('totalSystems').textContent = Object.keys(scannedData).length;
      document.getElementById('totalRoms').textContent = totalRoms;
      document.getElementById('totalMissing').textContent = totalMissing;
    }

    async function handleSelectFolder() {
      try {
        directoryHandle = await window.showDirectoryPicker({
          mode: 'readwrite',
          suggestedName: 'ArkOS SD'
        });

        document.getElementById('folderPath').textContent = directoryHandle.name;
        document.getElementById('folderPath').classList.remove('hidden');

        log(`Carpeta seleccionada: ${directoryHandle.name}`);
        log('Escaneando estructura...');

        const systems = await findSystemFolders(directoryHandle);

        log(`Encontrados ${Object.keys(systems).length} sistemas`);

        for (const [key, data] of Object.entries(systems)) {
          data.games = await checkCovers(data);
          log(`  ${key}: ${data.roms.length} ROMs, ${data.images.length} imágenes`);
        }

        scannedData = systems;
        selectedSystems = new Set(Object.keys(systems));
        document.getElementById('statsSection').classList.remove('hidden');
        document.getElementById('scrapingBtn').disabled = false;

        renderSystems();
        log('Escaneo completado!');

      } catch (e) {
        if (e.name !== 'AbortError') {
          log(`Error: ${e.message}`);
          console.error(e);
        }
      }
    }

    document.getElementById('selectFolderBtn').addEventListener('click', handleSelectFolder);
    document.getElementById('scrapingBtn').addEventListener('click', simulateScraping);
    document.getElementById('stopBtn').addEventListener('click', stopScraping);
    document.getElementById('selectAllBtn').addEventListener('click', selectAllSystems);
    document.getElementById('deselectAllBtn').addEventListener('click', deselectAllSystems);
    document.getElementById('testLoginBtn').addEventListener('click', function() {
      const user = document.getElementById('ssUser').value.trim();
      const pass = document.getElementById('ssPass').value;
      const devid = document.getElementById('devId').value.trim();
      const devpass = document.getElementById('devPass').value;
      if (user && pass) {
        testLogin(user, pass, devid, devpass);
      } else {
        log('Ingresa usuario y password');
      }
    });
    
    document.addEventListener('change', function(e) {
      if (e.target.classList.contains('system-checkbox')) {
        const key = e.target.dataset.system;
        if (e.target.checked) {
          selectedSystems.add(key);
        } else {
          selectedSystems.delete(key);
        }
        renderSystems();
      }
    });
    
    document.getElementById('destFolderSelect').addEventListener('change', function() {
      const customInput = document.getElementById('customFolderInput');
      if (this.value === 'custom') {
        customInput.classList.remove('hidden');
      } else {
        customInput.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
